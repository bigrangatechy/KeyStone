syntax = "proto3";

package keystone.v1;

message Label {
  string name = 1;
  string value = 2;
}

message Sample {
  string metric = 1;
  repeated Label labels = 2;
  double value = 3;
  int64 timestamp_unix_ms = 4;
}

message Heartbeat {
  string node_id = 1;
  string hostname = 2;
  string agent_version = 3;
  string os = 4;
  string kernel = 5;
  string docker_version = 6;
  repeated Label labels = 7;
}

message PushFrame {
  Heartbeat heartbeat = 1;
  repeated Sample samples = 2;
  string ingest_token = 3;
}

message Ack {
  bool ok = 1;
  string error = 2;
}

// op is DockerOp::as_str(); payload_json is op-specific arguments.
message Command {
  string request_id = 1;
  string op = 2;
  string payload_json = 3;
}

message CommandResult {
  string request_id = 1;
  bool ok = 2;
  string payload_json = 3;
  string error = 4;
}

message StreamChunk {
  string request_id = 1;
  bytes data = 2;
  bool eof = 3;
}

message AgentToServer {
  oneof body {
    PushFrame push = 1;
    CommandResult result = 2;
    StreamChunk chunk = 3;
  }
}

message ServerToAgent {
  oneof body {
    Ack ack = 1;
    Command command = 2;
  }
}

service Ingest {
  rpc Session(stream AgentToServer) returns (stream ServerToAgent);
}
