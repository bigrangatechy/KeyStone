[package]
name = "keystone-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "KeyStone server: ingest, scrape, per-node UI, operator /help"

[[bin]]
name = "keystone"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
askama.workspace = true
axum.workspace = true
axum-extra.workspace = true
axum-server.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hostname.workspace = true
hyper-util.workspace = true
keystone-core.workspace = true
mdns-sd.workspace = true
keystone-proto.workspace = true
keystone-store.workspace = true
parking_lot.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
totp-rs.workspace = true
qrcode.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
trycmd = "0.15"

[package.metadata.deb]
name = "keystone-server"
section = "net"
priority = "optional"
# Never depend on docker.io / docker-ce / containerd. The server has no
# engine socket; agents talk to Docker locally. An Engine package upgrade
# would bounce containers — KeyStone must not pull that in.
depends = "$auto, adduser"
revision = "2"
license-file = ["../../COPYING", "0"]
extended-description = """KeyStone server (the UI) for Debian and Raspberry Pi OS (64-bit).
Central ingest, Prometheus/SNMP scrape, per-node dashboard, and operator /help.
Install this on one machine. Other nodes only need keystone-agent.
The two packages do not conflict: install both on the UI host to monitor it too."""
assets = [
    ["target/release/keystone", "usr/bin/", "755"],
    ["../../packaging/deb/server/server.toml", "etc/keystone/server.toml", "640"],
    ["../../packaging/deb/server/default", "etc/default/keystone-server", "644"],
]
conf-files = [
    "/etc/keystone/server.toml",
    "/etc/default/keystone-server",
]
maintainer-scripts = "../../packaging/deb/server"
systemd-units = { unit-name = "keystone-server", enable = true, start = false, unit-scripts = "../../packaging/deb/server" }
