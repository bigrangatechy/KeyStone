<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authenticator — KeyStone</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <div>
    <form class="login" method="post" action="/login/totp">
      <img class="login-mark" src="/static/logo.svg" width="72" height="72" alt="">
      <h1>Authenticator</h1>
      <p class="muted">Enter the 6-digit code from your authenticator app, or a backup code.</p>
      {% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
      <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
      <button type="submit">Continue</button>
    </form>
    <form class="login-logout" method="post" action="/logout">
      <button type="submit">Log out</button>
    </form>
  </div>
</body>
</html>
