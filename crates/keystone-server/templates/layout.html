<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KeyStone{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/"><img src="/static/logo.svg" width="28" height="28" alt="">KeyStone</a>
    <nav>
      <a href="/">Nodes</a>
      <a href="/alerts" id="nav-alerts">Alerts <span class="nav-count is-idle" id="nav-alert-count"></span></a>
      <a href="/audit">Audit</a>
      <a href="/settings">Settings</a>
      <a href="/help">Help</a>
      <form class="inline" method="post" action="/logout"><button type="submit">Log out</button></form>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
