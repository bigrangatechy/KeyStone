{% extends "layout.html" %}
{% block title %}{{ title }} — {{ subtitle }}{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="muted"><a href="{{ back_href }}">← Back</a></p>
    <h1>{{ title }}</h1>
    <p class="muted"><code>{{ node_id }}</code> · {{ subtitle }} · {{ hint }}</p>
  </div>
</section>
<pre class="logs" id="log-view" data-stream="{{ stream_url }}"></pre>
{% endblock %}
