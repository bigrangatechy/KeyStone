[package]
name = "keystone-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "KeyStone node agent: catalog collectors, Docker control, gRPC push"

[[bin]]
name = "keystone-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bollard.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
clap-markdown.workspace = true
futures-util.workspace = true
hostname.workspace = true
keystone-core.workspace = true
keystone-proto.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
trycmd = "0.15"

[package.metadata.deb]
name = "keystone-agent"
section = "net"
priority = "optional"
depends = "$auto, adduser"
license-file = ["../../COPYING", "0"]
extended-description = """KeyStone agent for Debian and Raspberry Pi OS (64-bit).
Pushes host metrics to a KeyStone server. Optional Docker Engine access
via the local socket. No node cap."""
assets = [
    ["target/release/keystone-agent", "usr/bin/", "755"],
    ["../../packaging/deb/agent/agent.toml", "etc/keystone/agent.toml", "640"],
    ["../../packaging/deb/agent/default", "etc/default/keystone-agent", "644"],
]
conf-files = [
    "/etc/keystone/agent.toml",
    "/etc/default/keystone-agent",
]
maintainer-scripts = "../../packaging/deb/agent"
systemd-units = { unit-name = "keystone-agent", enable = true, start = false, unit-scripts = "../../packaging/deb/agent" }
