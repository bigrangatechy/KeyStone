[package]
name = "keystone-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "KeyStone node agent: catalog collectors, Docker control, gRPC push"
default-run = "keystone-agent"

[[bin]]
name = "keystone-agent"
path = "src/main.rs"

[[bin]]
name = "keystone-sys"
path = "src/bin/keystone-sys.rs"

[dependencies]
anyhow.workspace = true
bollard.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
hostname.workspace = true
keystone-core.workspace = true
mdns-sd.workspace = true
keystone-proto.workspace = true
prost.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
trycmd = "0.15"

[package.metadata.deb]
name = "keystone-agent"
section = "net"
priority = "optional"
# Never depend on docker.io / docker-ce / containerd. Upgrading Engine
# restarts containers; KeyStone must not pull that in. Socket access is
# optional at runtime via the docker group.
depends = "$auto, adduser"
revision = "12"
license-file = ["../../COPYING", "0"]
extended-description = """KeyStone agent for Debian and Raspberry Pi OS (64-bit).
Pushes host metrics to a KeyStone server. Optional Docker Engine access
via the local socket. Optional host system-admin helper (keystone-sys),
off until you enable keystone-sys.socket. Install on every node, including
the UI host if you want that machine in the dashboard. No node cap."""
assets = [
    ["target/release/keystone-agent", "usr/bin/", "755"],
    ["target/release/keystone-sys", "usr/lib/keystone/", "755"],
    ["../../packaging/deb/agent/keystone-sys.service", "lib/systemd/system/", "644"],
    ["../../packaging/deb/agent/keystone-sys.socket", "lib/systemd/system/", "644"],
    ["../../packaging/deb/agent/agent.toml", "etc/keystone/agent.toml", "640"],
    ["../../packaging/deb/agent/default", "etc/default/keystone-agent", "644"],
]
conf-files = [
    "/etc/keystone/agent.toml",
    "/etc/default/keystone-agent",
]
maintainer-scripts = "../../packaging/deb/agent"
systemd-units = { unit-name = "keystone-agent", enable = true, start = false, unit-scripts = "../../packaging/deb/agent" }
