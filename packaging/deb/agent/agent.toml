#
# Packaged default. Prefer the agent.toml from Add node in the UI.
# Edit ingest_url and ingest_token if you skip that, then:
#   systemctl enable --now keystone-agent
#
# Docker, poll interval, labels, and compose paths are node Settings
# after the agent connects. docker.host stays here if the socket is
# not /var/run/docker.sock.

ingest_url = "http://keystone.home.arpa:9100"
ingest_token = "change-me"
buffer_dir = "/var/lib/keystone/agent-buffer"
# tls_ca_file = "/etc/keystone/ca.pem"  # private CA / self-signed; omit for Let's Encrypt
