#
# Packaged default. Edit ingest_url and ingest_token, then:
#   systemctl enable --now keystone-agent

ingest_url = "http://keystone.home.arpa:9100"
ingest_token = "change-me"
# Overridden while connected by node Settings (poll interval, default 1s).
interval_secs = 1
buffer_dir = "/var/lib/keystone/agent-buffer"

[labels]
role = "homelab"

[docker]
enabled = false
manage = false
allow_exec = false
compose_paths = []
