[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # tonic 0.12 still depends on rustls-pemfile. 2.2 is a thin wrapper
    # around rustls-pki-types; no safe upgrade until tonic moves.
    { id = "RUSTSEC-2025-0134", reason = "tonic 0.12 rustls-pemfile wrapper" },
]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "GPL-2.0-or-later",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "NCSA",
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
