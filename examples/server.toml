# Example KeyStone server config for a local smoke test (writable without root).
# Packaged installs use /var/lib/keystone and 0.0.0.0:8080 / :9100.
# These loopback ports exist so `cargo run` can sit beside an installed
# keystone-server without EADDRINUSE, and so smoke does not advertise
# ingest on the LAN (mDNS skips loopback). Empty password_hash uses
# KEYSTONE_ADMIN_PASSWORD, or changeme. Run `cargo run` from the repo root.
#
# Listen addresses, data_dir, and auth.username stay here (development /
# bootstrap). Retention, ingest token, and scrape jobs are seeded from this
# file on first start, then edited in the UI Settings page.

http_listen = "127.0.0.1:18080"
grpc_listen = "127.0.0.1:19100"
data_dir = ".smoke"
ingest_token = "change-me"
# retention_hours = 24   # seed only; change in Settings after first start

[auth]
username = "admin"
password_hash = ""

# Optional TLS (rustls). Empty / omitted = plaintext (this smoke file).
# Same cert can wrap the UI and gRPC ingest. Agents then use https:// and,
# for a private CA, tls_ca_file.
# [tls]
# cert_file = "tls/fullchain.pem"
# key_file = "tls/privkey.pem"
# ingest = true

