# Example KeyStone agent config. Parsed in tests — keep it valid.

ingest_url = "http://127.0.0.1:9100"
ingest_token = "change-me"
# node_id defaults to hostname when omitted
interval_secs = 15
buffer_dir = "/var/lib/keystone/agent-buffer"

[labels]
role = "example"

[docker]
enabled = false
manage = false
allow_exec = false
# host = "unix:///var/run/docker.sock"
compose_paths = []
