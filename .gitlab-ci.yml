stages:
  - check
  - docs
  - package
  - pages

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

default:
  image: rust:bookworm
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - /usr/local/cargo/registry
      - target

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

test:
  stage: check
  script:
    - cargo test --workspace

deny:
  stage: check
  script:
    - cargo install cargo-deny --locked
    - cargo deny check

reuse:
  stage: check
  image: fsfe/reuse:latest
  script:
    - reuse lint
  cache: []

docs:
  stage: docs
  script:
    - cargo run -p xtask -- docs
    - git diff --exit-code -- docs/src/generated
    - cargo install mdbook --locked
    - mdbook build docs
  artifacts:
    paths:
      - docs/book
    expire_in: 1 week

.deb:
  stage: package
  image: rust:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gcc libc6-dev pkg-config
    - cargo install cargo-deb --locked
  artifacts:
    paths:
      - target/debian/*.deb
      - target/*/debian/*.deb
    expire_in: 2 weeks

package:amd64:
  extends: .deb
  script:
    - cargo deb -p keystone-agent
    - cargo deb -p keystone-server
    - mkdir -p target/debian
    - find target -name '*.deb' -exec cp -n {} target/debian/ \; || true

package:arm64:
  extends: .deb
  script:
    - apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    - rustup target add aarch64-unknown-linux-gnu
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
    - cargo deb -p keystone-agent --target aarch64-unknown-linux-gnu
    - cargo deb -p keystone-server --target aarch64-unknown-linux-gnu
    - mkdir -p target/debian
    - find target -name '*.deb' -exec cp -n {} target/debian/ \; || true

pages:
  stage: pages
  needs: ["docs"]
  script:
    - mkdir -p public
    - cp -r docs/book/html public/ || cp -r docs/book public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
